name: Build Geode Mod

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload Geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: mikegdmod-geode
          path: |
            build/**/*.geode
            **/*.geode
